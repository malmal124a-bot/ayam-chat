# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - lib_old/**
    - build/**
    - .dart_tool/**
  errors:
    deprecated_member_use: ignore
    use_build_context_synchronously: ignore
    avoid_print: ignore
    unnecessary_brace_in_string_interps: ignore
    invalid_annotation_target: ignore
    todo: ignore
    prefer_final_fields: ignore
    empty_catches: ignore
    use_super_parameters: ignore
    prefer_const_constructors: ignore
    prefer_const_literals_to_create_immutables: ignore
    sort_child_properties_last: ignore
    sized_box_for_whitespace: ignore
    use_key_in_widget_constructors: ignore
    no_leading_underscores_for_library_prefixes: ignore
    prefer_single_quotes: ignore
    library_private_types_in_public_api: ignore
    non_constant_identifier_names: ignore
    camel_case_types: ignore
    constant_identifier_names: ignore
    file_names: ignore
    curly_braces_in_flow_control_structures: ignore
    unnecessary_to_list_in_spreads: ignore
    prefer_interpolation_to_compose_strings: ignore
    unnecessary_nullable_for_final_variable_declarations: ignore
    avoid_web_libraries_in_flutter: ignore
    unused_element: ignore
    unnecessary_import: ignore
    unused_field: ignore
    unused_local_variable: ignore
    unnecessary_non_null_assertion: ignore
    undefined_lint: ignore

linter:
  rules:
    avoid_print: false
    use_build_context_synchronously: false
    always_use_package_imports: false
    prefer_final_fields: false
    empty_catches: false
    use_super_parameters: false
    prefer_const_constructors: false
    prefer_const_literals_to_create_immutables: false
    sort_child_properties_last: false
    sized_box_for_whitespace: false
    use_key_in_widget_constructors: false
    no_leading_underscores_for_library_prefixes: false
    prefer_single_quotes: false
    library_private_types_in_public_api: false
    non_constant_identifier_names: false
    camel_case_types: false
    constant_identifier_names: false
    file_names: false
    curly_braces_in_flow_control_structures: false
    unnecessary_to_list_in_spreads: false
    prefer_interpolation_to_compose_strings: false
    unnecessary_nullable_for_final_variable_declarations: false
    unused_field: false
    unused_local_variable: false
    unnecessary_non_null_assertion: false

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
