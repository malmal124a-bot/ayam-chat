<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ayam Chat Admin Portal - Web-based administration panel">
  <meta name="google-signin-client_id" content="1042012231539-467c8hihngos4l2msh09s8lsmb25nf0h.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ayam Admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Google Fonts - Roboto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <title>Ayam Chat Admin Portal</title>
  <link rel="manifest" href="admin_manifest.json">
</head>
<body>
  <script>
    // Initialize Flutter with admin entry point
    _flutter = {
      loader: {
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        }
      }
    };
    
    // Load the admin main entry point
    if (!flutter_bootstrap) {
      console.error("Flutter bootstrap not found");
    } else {
      flutter_bootstrap({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: async function(engineInitializer) {
          let appRunner = await engineInitializer.initializeEngine({
            hostElement: document.body,
            assetBase: "/",
          });
          await appRunner.runApp();
        }
      });
    }
  </script>
</body>
</html>
