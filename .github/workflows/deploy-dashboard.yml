name: Deploy Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'admincore-dashboard/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dashboard dependencies
        working-directory: admincore-dashboard
        run: npm install

      - name: Build dashboard
        working-directory: admincore-dashboard
        run: npm run build

      - name: Deploy to Vercel (production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          # Team that owns the dashboard project (admincore-dashboar):
          vercel-org-id: team_xJaun2gTEktZdEmrANnKZnjd
          vercel-project-id: prj_omGZlJslQ25iWLwTvNvXnnwVP6pb
          working-directory: admincore-dashboard
          vercel-args: '--prod'
