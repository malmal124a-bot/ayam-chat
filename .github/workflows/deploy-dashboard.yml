name: Deploy Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'admincore-dashboard/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dashboard dependencies
        working-directory: admincore-dashboard
        run: npm install

      - name: Build dashboard
        working-directory: admincore-dashboard
        env:
          VITE_SUPABASE_SERVICE_ROLE: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE }}
        run: npm run build

      - name: Deploy to Vercel (production) via REST API
        working-directory: admincore-dashboard
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: team_xJaun2gTEktZdEmrANnKZnjd
          VERCEL_PROJECT_ID: prj_omGZlJslQ25iWLwTvNvXnnwVP6pb
        run: node deploy-vercel.mjs dist
